name: Build the Android APK
on:
  push:
    branches: [codex/mobile-map-release]
    paths: ['Web/**', 'Mobile/Android/**', 'Mobile/VERSION', '.github/workflows/android-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: gradle -p Mobile/Android :app:assembleRelease
      - name: Verify the packaged map and installation metadata
        shell: bash
        run: |
          set -euo pipefail
          unsigned=Mobile/Android/app/build/outputs/apk/release/app-release-unsigned.apk
          apk=Mobile/Android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          keystore="$RUNNER_TEMP/railway-atlas-test-signing.p12"
          key_password='railway-atlas-test'
          keytool -genkeypair -noprompt \
            -keystore "$keystore" -storetype PKCS12 \
            -storepass "$key_password" -keypass "$key_password" \
            -alias railway-atlas-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Railway Atlas Test, OU=Railway Atlas, O=WonGary, C=CN'
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias railway-atlas-test \
            --ks-pass "pass:$key_password" \
            --key-pass "pass:$key_password" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$apk" "$unsigned"
          "$tools/aapt" dump badging "$apk" | head -n 12
          "$tools/zipalign" -c 4 "$apk"
          unzip -p "$apk" assets/index.html | cmp Web/index.html -
          unzip -p "$apk" assets/data/station-layouts.json | cmp Sources/RailwayAtlas/Resources/station-layouts.json -
          unzip -p "$apk" assets/data/station-layouts.js | cmp Sources/RailwayAtlas/Resources/station-layouts.js -
          unzip -p "$apk" assets/data/world-stations/index.json | cmp Web/data/world-stations/index.json -
          unzip -p "$apk" assets/data/metro/macao.json | cmp Web/data/metro/macao.json -
          unzip -p "$apk" assets/vendor/sqlite/sqlite3.wasm | cmp Web/vendor/sqlite/sqlite3.wasm -
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-test
          path: Mobile/Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: Mobile/Android/app/build/outputs/apk/release/app-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
