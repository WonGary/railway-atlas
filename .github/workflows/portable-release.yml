name: Check published packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string
      android_only:
        description: Check only the published Android APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android-apk:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'web-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/atlas-device"
          mkdir -p "$work"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$work" --pattern '*.apk' --pattern SHA256SUMS.txt
          cd "$work"
          sha256sum --check --ignore-missing SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ./*.apk
      - name: Prepare an Android 15 device
        shell: bash
        run: |
          set -euo pipefail
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator' 'platform-tools'
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n railway -k 'system-images;android-35;google_apis;x86_64' --device pixel_6 <<< no
          "$ANDROID_HOME/emulator/emulator" -accel-check
          df -h "$RUNNER_TEMP" "$ANDROID_HOME"
      - name: Install and open the map with the network disabled
        timeout-minutes: 8
        env:
          ANDROID_SERIAL: emulator-5554
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-device"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd railway -port 5554 -accel on -no-window -no-snapshot \
            -no-audio -no-boot-anim -gpu software -memory 2048 -cores 2 -partition-size 2048 >emulator.log 2>&1 &
          emulator_pid=$!
          trap 'tail -80 emulator.log' ERR
          deadline=$((SECONDS + 240))
          until [[ "$(timeout 3 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            kill -0 "$emulator_pid"
            (( SECONDS < deadline ))
            sleep 2
          done
          adb shell wm dismiss-keyguard
          adb install ./*.apk
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb shell svc data disable
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
          adb shell am start -W -n app.railwayatlas.android/.AtlasActivity
          python3 "$GITHUB_WORKSPACE/Mobile/android-smoke.py"
  desktop:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'web-v') && !inputs.android_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: Windows-x64
            command: Railway-Atlas.exe
          - os: windows-11-arm
            package: Windows-arm64
            command: Railway-Atlas.exe
          - os: macos-latest
            package: macOS-universal
            command: Railway-Atlas
          - os: macos-15-intel
            package: macOS-universal
            command: Railway-Atlas
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Download the release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          TARGET: ${{ matrix.package }}
        shell: bash
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*-$TARGET.zip" --pattern SHA256SUMS.txt
      - name: Verify checksum and launch the extracted app
        shell: python
        env:
          LAUNCHER: ${{ matrix.command }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          import hashlib, os, pathlib, subprocess, time, urllib.request, zipfile
          root = pathlib.Path.cwd()
          archive, = root.glob("*.zip")
          sums = dict(line.split("  ")[::-1] for line in pathlib.Path("SHA256SUMS.txt").read_text().splitlines())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == sums[archive.name]
          with zipfile.ZipFile(archive) as src:
              src.extractall("test-distribution")
          app = root / "test-distribution" / os.environ["LAUNCHER"]
          app.chmod(0o755)
          process = subprocess.Popen([str(app), "-no-open"])
          try:
              for attempt in range(40):
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:18763/") as page:
                          version = os.environ["TAG"].removeprefix("web-v")
                          assert f'id="versionBadge">{version}<'.encode() in page.read()
                      break
                  except OSError:
                      if process.poll() is not None or attempt == 39: raise
                      time.sleep(0.25)
          finally:
              process.terminate()
              process.wait(timeout=5)
  mobile-web:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'web-v') && !inputs.android_only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - name: Test the released web archive with a mobile browser profile
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          ENGINE: ${{ matrix.engine }}
        shell: bash
        run: |
          work="$RUNNER_TEMP/railway-release"
          mkdir -p "$work"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$work" --pattern '*-Web-PWA.zip' --pattern SHA256SUMS.txt
          cd "$work"
          sha256sum --check --ignore-missing SHA256SUMS.txt
          unzip -q ./*-Web-PWA.zip
          npm install --no-audit --no-fund --prefix "$work" playwright-core@1.65.1
          "$work/node_modules/.bin/playwright-core" install --with-deps "$ENGINE"
          NODE_PATH="$work/node_modules" node "$GITHUB_WORKSPACE/Portable/check-mobile.cjs" "$ENGINE"
