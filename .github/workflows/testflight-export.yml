name: Export a signed TestFlight IPA
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'App Store Connect build number (increase it for each upload)'
        type: string
        required: true
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Load the account owner's distribution identity
        shell: bash
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$P12" && test -n "$PASS" && test -n "$PROFILE" || { echo "Configure the three iOS signing secrets listed in Mobile/README.md."; exit 1; }
          kc="$RUNNER_TEMP/railway-signing.keychain-db"
          pass=$(openssl rand -hex 25)
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE" | base64 -D > "$RUNNER_TEMP/atlas.mobileprovision"
          security create-keychain -p "$pass" "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security import "$RUNNER_TEMP/distribution.p12" -P "$PASS" -k "$kc" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/atlas.mobileprovision" -o "$RUNNER_TEMP/profile.plist"
          python3 Mobile/ios-export-options.py "$RUNNER_TEMP"
      - name: Archive and export for App Store Connect
        env:
          BUILD: ${{ inputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD" =~ ^[1-9][0-9]{0,8}$ ]]
          version=$(cat Mobile/VERSION)
          archive="$RUNNER_TEMP/Railway-Atlas.xcarchive"
          xcodebuild -project RailwayAtlas.xcodeproj -scheme RailwayAtlas-iOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' "DEVELOPMENT_TEAM=$SIGN_TEAM" \
            "PROVISIONING_PROFILE_SPECIFIER=$SIGN_PROFILE" "PRODUCT_BUNDLE_IDENTIFIER=$SIGN_BUNDLE" \
            "CURRENT_PROJECT_VERSION=$BUILD" "MARKETING_VERSION=$version" archive
          xcodebuild -exportArchive -archivePath "$archive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p out "$RUNNER_TEMP/check"
          cp "$RUNNER_TEMP"/export/*.ipa "out/Railway-Atlas-$version-TestFlight.ipa"
          unzip -qo out/*.ipa -d "$RUNNER_TEMP/check"
          app="$RUNNER_TEMP/check/Payload/RailwayAtlas-iOS.app"
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "$SIGN_BUNDLE"
          test -s "$app/embedded.mobileprovision"
      - uses: actions/upload-artifact@v4
        with: {name: signed-TestFlight-IPA, path: 'out/*.ipa', if-no-files-found: error, retention-days: 7}
