name: Build native iPhone and iPad archive
on:
  push:
    branches: [codex/mobile-map-release]
    paths: ['Sources/**', 'Config/**', 'Design/**', 'RailwayAtlas.xcodeproj/**', 'Mobile/VERSION', '.github/workflows/ios-device.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive the native app for physical devices
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk%%.*}" -ge 26
          version=$(cat Mobile/VERSION)
          build="$GITHUB_RUN_NUMBER"
          archive="$RUNNER_TEMP/Railway-Atlas.xcarchive"
          xcodebuild -project RailwayAtlas.xcodeproj -scheme RailwayAtlas-iOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= archive
          app="$archive/Products/Applications/RailwayAtlas-iOS.app"
          test "$(plutil -extract CFBundleSupportedPlatforms.0 raw "$app/Info.plist")" = iPhoneOS
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" = "$build"
          lipo "$app/RailwayAtlas-iOS" -verify_arch arm64
          test -s "$app/Assets.car"
          test -s "$app/china-overview.railcache"
          test -s "$app/PrivacyInfo.xcprivacy"
          cmp "$app/station-layouts.json" Sources/RailwayAtlas/Resources/station-layouts.json
          cmp "$app/station-layouts.js" Sources/RailwayAtlas/Resources/station-layouts.js
          diff -qr "$app/world-stations" Sources/RailwayAtlas/Resources/world-stations
          cmp "$app/RailGames/native.html" Sources/RailwayAtlas/Resources/RailGames/native.html
          cmp "$app/rail-games.js" Web/rail-games.js
          cmp "$app/games/outlines.json" Web/games/outlines.json
          cmp "$app/station-directory/national.js" Web/station-directory/national.js
          diff -qr "$app/station-directory/paths" Web/station-directory/paths
          codesign --verify --deep --strict "$app"
          find "$app" -name 'metro-snapshot-beijing.json' | grep -q .
          mkdir -p out
          ditto -c -k --keepParent "$archive" "out/Railway-Atlas-$version-iOS-xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-archive
          path: out/*.zip
          compression-level: 0
          if-no-files-found: error
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the installed iPhone app
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if ".iOS-" in runtime
                     for d in devices[runtime] if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b &
          boot=$!
          xcodebuild -project RailwayAtlas.xcodeproj -scheme RailwayAtlas-iOS \
            -configuration Release -destination "id=$device" \
            -derivedDataPath "$RUNNER_TEMP/atlas-sim-build" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          wait "$boot"
          app="$RUNNER_TEMP/atlas-sim-build/Build/Products/Release-iphonesimulator/RailwayAtlas-iOS.app"
          xcrun simctl install "$device" "$app"
          data=$(xcrun simctl get_app_container "$device" app.railwayatlas.ios data)
          mkdir -p "$data/tmp/station-ui"
          export TEST_RUNNER_ATLAS_STATION_TEST_DIR="$data/tmp/station-ui"
          failed=0
          xcodebuild -project RailwayAtlas.xcodeproj -scheme RailwayAtlas-iOS \
            -configuration Release -destination "id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/atlas-sim-build" -resultBundlePath "$RUNNER_TEMP/station-board.xcresult" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -only-testing:StationBoardUITests test || failed=1
          export ATLAS_SIM_EVIDENCE="$RUNNER_TEMP/atlas-sim-receipts"
          for suite in games passport inspector ticket; do
            node Checks/check-rail-games-installed.cjs ios "$device" "$suite" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-station-board-ui
          path: ${{ runner.temp }}/station-board.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-receipts
          path: ${{ runner.temp }}/atlas-sim-receipts
          if-no-files-found: ignore
