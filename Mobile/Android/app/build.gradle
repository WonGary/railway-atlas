plugins { id 'com.android.application' version '8.9.2' }

def atlasVersion = file('../../VERSION').text.trim()
def parts = atlasVersion.tokenize('.').collect { it.toInteger() }
android {
    namespace 'app.railwayatlas.android'
    compileSdk 35
    defaultConfig {
        applicationId 'app.railwayatlas.android'
        minSdk 26
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName atlasVersion
    }
    sourceSets.main.assets.srcDirs = [file('../../../Web')]
    sourceSets.main.res.srcDir(layout.buildDirectory.dir('generated/atlas-res'))
}
tasks.register('copyAtlasIcon', Copy) {
    from('../../../Web/icon-192.png')
    into(layout.buildDirectory.dir('generated/atlas-res/drawable-nodpi'))
    rename { 'railway_atlas.png' }
}
tasks.named('preBuild').configure { dependsOn('copyAtlasIcon') }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
